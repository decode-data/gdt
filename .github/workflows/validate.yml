name: validate

on:
  pull_request:
    branches: [main]

jobs:
  schema-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate schema is valid JSON Schema (2020-12)
        run: |
          python3 - <<'PY'
          import json
          import sys
          from jsonschema import Draft202012Validator

          with open("schema/gdt-v0.1.schema.json") as f:
              schema = json.load(f)

          declared = schema.get("$schema", "")
          if "2020-12" not in declared:
              print(f"::error::schema declares $schema={declared!r}, expected a 2020-12 dialect URI")
              sys.exit(1)

          Draft202012Validator.check_schema(schema)
          print("schema/gdt-v0.1.schema.json is valid JSON Schema (2020-12)")
          PY

      - name: Check schema / docs/categories.md sync
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          SCHEMA_CHANGED=false
          CATEGORIES_CHANGED=false
          echo "$CHANGED" | grep -qx "schema/gdt-v0.1.schema.json" && SCHEMA_CHANGED=true
          echo "$CHANGED" | grep -qx "docs/categories.md" && CATEGORIES_CHANGED=true

          if [ "$SCHEMA_CHANGED" = true ] && [ "$CATEGORIES_CHANGED" = false ]; then
            echo "::error::schema/gdt-v0.1.schema.json changed without docs/categories.md changing. Per CONTRIBUTING.md, a PR touching one must keep the other in sync (or explain in the PR description why not)."
            exit 1
          fi

          if [ "$CATEGORIES_CHANGED" = true ] && [ "$SCHEMA_CHANGED" = false ]; then
            echo "::error::docs/categories.md changed without schema/gdt-v0.1.schema.json changing. Per CONTRIBUTING.md, a PR touching one must keep the other in sync (or explain in the PR description why not)."
            exit 1
          fi

          echo "schema/docs sync check passed (changed together, or neither changed)"
